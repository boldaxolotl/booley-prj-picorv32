name: Sponsored-mode smoke

# Boots the sponsored (gateway) Codespaces environment headless against a local
# gateway stub. No real gateway and no real credential: the stub's TLS CA and
# bearer token are generated per run. See tests/ci/sponsored-smoke/run_smoke.py.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to notice when the pinned image or Codex stops matching the stub.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsored-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Stub unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1
      - run: python -m pytest -q tests/ci/test_sponsored_smoke.py

  smoke:
    name: Smoke (${{ matrix.name }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway env
            args: --expect pass
          - name: gateway env removed
            args: --expect fail --without-gateway-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image's Node and Docker run the devcontainer CLI.
      - name: Run smoke
        run: python3 tests/ci/sponsored-smoke/run_smoke.py ${{ matrix.args }}
      # upload-artifact rejects '..' in paths, so resolve the sibling dir first.
      - name: Locate evidence
        id: stub
        if: always()
        run: echo "dir=$(realpath "$GITHUB_WORKSPACE/../gateway-stub")" >> "$GITHUB_OUTPUT"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sponsored-smoke-${{ strategy.job-index }}-${{ github.run_attempt }}
          # Doctor and Codex output plus the stub's request log; never the
          # token or keys, which also sit in the same directory.
          path: |
            ${{ steps.stub.outputs.dir }}/evidence/
            ${{ steps.stub.outputs.dir }}/requests.jsonl
          if-no-files-found: warn
          retention-days: 14
