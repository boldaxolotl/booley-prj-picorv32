# Booley execution policy for the PicoRV32 demo. Build inputs live in the
# authored FuseSoC cores; named simulation tests live in tests.toml.

[project]
name = "picorv32"

[stealth]
# Stealth mode is enabled here to keep the repo self-contained.
enabled = true
# The cores shipped with this IP are incompatible with current FuseSoC: the
# root core fails the CAPI2 schema and the bundled targets use the legacy API.
ignore_native_cores = true

# No [agent] pin: Booley's default (Claude Code, `auth = "auto"`) applies, so
# an API key or a CLI login both work. Set `[agent] provider = "codex"` here
# before `booley init` to use Codex locally. In GitHub Codespaces,
# BOOLEY_AGENT_APP=auto picks the agent from the visitor's credentials.

[sandbox]
image = "booley-sandbox-riscv"

[flows.sim]
enabled = true
pass_sentinels = ["ALL TESTS PASSED.", "DMIPS_Per_MHz:"]
fail_sentinels = ["ERROR!", "TIMEOUT"]
trace_files = ["testbench.vcd"]

[flows.lint]
enabled = true

[flows.synth]
enabled = true

[flows.fpga]
enabled = false
