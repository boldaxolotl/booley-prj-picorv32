# Booley execution policy for the PicoRV32 demo. Build inputs live in the
# authored FuseSoC cores; named simulation tests live in tests.toml.

[project]
name = "picorv32"

[stealth]
# Stealth mode is enabled here to keep the repo self-contained.
enabled = true
# The cores shipped with this IP are incompatible with current FuseSoC: the
# root core fails the CAPI2 schema and the bundled targets use the legacy API.
ignore_native_cores = true

# Codex is the default Agent CLI: it runs on a local Codex login or, in GitHub
# Codespaces, on the Booley demo gateway. Claude Code stays available with
# `booley chat --cli claude`.
#
# `auth = "visitor"` is for the demo Codespace: each CLI uses the login the
# visitor signs in with, and Codex falls back to the demo gateway. Outside a
# hand-written Sandbox it does not apply: on a local clone, `booley init`
# replaces it with the policy detected from your own logins; commit that change
# in your clone (README Quick start).
[agent]
clis = ["codex", "claude"]
default = "codex"
auth = "visitor"

[sandbox]
image = "booley-sandbox-riscv"
# Fits a 16 GB machine, including the demo Codespace, and leaves room for the
# editor. PicoRV32 Jobs peak well below it; `booley resources` shows the peaks.
memory = "8g"

[flows.sim]
enabled = true
pass_sentinels = ["ALL TESTS PASSED.", "DMIPS_Per_MHz:"]
fail_sentinels = ["ERROR!", "TIMEOUT"]
trace_files = ["testbench.vcd"]

[flows.lint]
enabled = true

[flows.synth]
enabled = true

[flows.fpga]
enabled = false
